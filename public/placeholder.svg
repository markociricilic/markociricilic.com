<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">

  
  <!-- Saucer -->
  <ellipse cx="7" cy="14" rx="5.5" ry="1.5" fill="#D93025"/>
  
  <!-- Cup body (face) -->
  <path d="M3 7 Q3 14 8 14 Q13 14 13 7 Z" fill="#E8860C"/>
  
  <!-- Handle -->
  <path d="M13 9 Q15 9 15 11 Q15 13 13 13" fill="none" stroke="#E8860C" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Left eye (closed) -->
  <path d="M5 9 Q6 8 7 9" fill="none" stroke="#1a1a1a" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="5.5" y1="9" x2="5.5" y2="8" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="6.5" y1="8.5" x2="6.5" y2="7.5" stroke="#1a1a1a" stroke-width="0.5"/>
  
  <!-- Right eye (closed) -->
  <path d="M9 9 Q10 8 11 9" fill="none" stroke="#1a1a1a" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="9.5" y1="9" x2="9.5" y2="8" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="10.5" y1="8.5" x2="10.5" y2="7.5" stroke="#1a1a1a" stroke-width="0.5"/>
  
  <!-- Mouth -->
  <ellipse cx="8" cy="12" rx="0.8" ry="0.6" fill="#0D7377"/>
  
  <!-- Stems -->
  <g stroke="#0D6B4F" stroke-width="0.7" fill="none">
    <line x1="5" y1="7" x2="5" y2="4"/>
    <line x1="7" y1="7" x2="7" y2="3"/>
    <line x1="8" y1="7" x2="8" y2="2.5"/>
    <line x1="9" y1="7" x2="9" y2="3"/>
    <line x1="11" y1="7" x2="11" y2="4"/>
  </g>
  
  <!-- Flowers -->
  <circle cx="5" cy="3.5" r="1.2" fill="#9B7EC9"/>
  <circle cx="5" cy="3.5" r="0.4" fill="#1a1a1a"/>
  
  <circle cx="7" cy="2.5" r="1.2" fill="#E84D8A"/>
  <circle cx="7" cy="2.5" r="0.4" fill="#1a1a1a"/>
  
  <circle cx="9" cy="2.5" r="1.2" fill="#4285F4"/>
  <circle cx="9" cy="2.5" r="0.4" fill="#1a1a1a"/>
  
  <circle cx="11" cy="3.5" r="1.2" fill="#34A853"/>
  <circle cx="11" cy="3.5" r="0.4" fill="#1a1a1a"/>
</svg>
